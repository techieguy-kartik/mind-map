name: Verify Atlas
on: [push, pull_request]
permissions:
  contents: read
jobs:
  crew:
    runs-on: ubuntu-latest
    env:
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TELEMETRY_DISABLED: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-crew.lock
      - run: .venv/bin/python -m pytest tests/test_crew.py -q
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag atlas-intelligence:ci .
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.lock
      - run: .venv/bin/python -m pytest -q
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
